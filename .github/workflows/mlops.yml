name: MLOps Pipeline

on:
  push:
    branches: [main, master]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        run: |
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > /tmp/aws-creds.json
          echo "AWS_ACCESS_KEY_ID=$(python -c "import json; print(json.load(open('/tmp/aws-creds.json'))['aws_access_key_id'])")" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$(python -c "import json; print(json.load(open('/tmp/aws-creds.json'))['aws_secret_access_key'])")" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=us-east-1" >> $GITHUB_ENV

      - name: Pull data with DVC
        run: dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc

      - name: Train model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_TOKEN: ${{ secrets.MLFLOW_TRACKING_TOKEN }}
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        run: |
          python - <<'EOF'
          import os
          import boto3

          bucket = os.environ["CLOUD_BUCKET"]
          s3 = boto3.client("s3")
          s3.upload_file("models/model.pkl", bucket, "models/latest/model.pkl")
          print(f"Uploaded model to s3://{bucket}/models/latest/model.pkl")
          EOF
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}

      - name: Save training artifacts
        uses: actions/upload-artifact@v4
        with:
          name: training-outputs
          path: |
            outputs/metrics.json
            outputs/report.txt

  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        run: |
          python - <<'EOF'
          acc = float("${{ needs.train.outputs.accuracy }}")
          if acc < 0.70:
              raise SystemExit(f"FAILED: accuracy {acc:.4f} < 0.70. Huy deploy.")
          print(f"PASSED: accuracy {acc:.4f} >= 0.70. Dang trien khai model.")
          EOF

  deploy:
    name: Deploy
    needs: [eval, train]
    runs-on: ubuntu-latest
    steps:

      - name: Authenticate to Cloud Storage
        run: |
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > /tmp/aws-creds.json
          echo "AWS_ACCESS_KEY_ID=$(python -c "import json; print(json.load(open('/tmp/aws-creds.json'))['aws_access_key_id'])")" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$(python -c "import json; print(json.load(open('/tmp/aws-creds.json'))['aws_secret_access_key'])")" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=us-east-1" >> $GITHUB_ENV

      - name: Download new metrics for rollback check
        uses: actions/download-artifact@v4
        with:
          name: training-outputs
          path: .

      - name: Bonus 4 - Rollback check vs previous metrics
        run: |
          python - <<'EOF'
          import json
          import os
          import boto3
          from botocore.exceptions import ClientError

          bucket = os.environ["CLOUD_BUCKET"]
          with open("outputs/metrics.json") as f:
              new_acc = float(json.load(f)["accuracy"])
          key = "models/latest/metrics.json"
          s3 = boto3.client("s3")

          try:
              s3.download_file(bucket, key, "/tmp/old_metrics.json")
              old_acc = float(json.load(open("/tmp/old_metrics.json"))["accuracy"])
              print(f"Rollback check: new={new_acc:.4f}, previous={old_acc:.4f}")
              # So sanh lam tron 4 chu so — tranh loi float (0.7539999 vs 0.754)
              if round(new_acc, 4) < round(old_acc, 4):
                  raise SystemExit(
                      f"FAILED rollback: accuracy moi {new_acc:.4f} < accuracy cu {old_acc:.4f}. Huy deploy."
                  )
              print("PASSED rollback: accuracy moi >= accuracy cu.")
          except ClientError as e:
              if e.response["Error"]["Code"] in ("404", "NoSuchKey"):
                  print("Khong co metrics cu tren S3 — lan deploy dau tien, bo qua rollback check.")
              else:
                  raise
          EOF
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl restart mlops-serve
            sleep 5
            curl -sf http://localhost:8000/health && echo "Health check passed." || exit 1

      - name: Upload metrics to S3 after successful deploy
        run: |
          python - <<'EOF'
          import os
          import boto3

          bucket = os.environ["CLOUD_BUCKET"]
          s3 = boto3.client("s3")
          s3.upload_file("outputs/metrics.json", bucket, "models/latest/metrics.json")
          print(f"Uploaded metrics to s3://{bucket}/models/latest/metrics.json")
          EOF
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
